<h1 class="mb-6 text-2xl font-bold">Courses</h1>

@if (courses.length === 0) {
  <p class="text-gray-500">Aucune matière</p>
} @else {
  <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    @for (course of courses; track course.id) {
      <article
        class="course-card"
        [class.selected]="selectedCourseId() === course.id"
        (click)="selectCourse(course.id)"
      >
        <h2 class="text-lg font-semibold">{{ course.title }}</h2>
        <p class="mt-1 text-sm text-gray-500">{{ course.description }}</p>

        <div class="mt-3">
          <div class="flex items-center justify-between text-sm">
            <span>{{ course.videoCount }} videos &middot; {{ course.totalHours }}h</span>
            <span>{{ course.progressPercent / 100 | percent }}</span>
          </div>
          <div class="mt-1 h-2 rounded-full bg-gray-200" role="progressbar" [attr.aria-valuenow]="course.progressPercent" aria-valuemin="0" aria-valuemax="100">
            <div class="h-full rounded-full bg-blue-500 transition-all" [style.width.%]="course.progressPercent"></div>
          </div>
        </div>

        <a
          [routerLink]="['/courses', course.id]"
          class="mt-3 inline-block text-sm text-blue-500 hover:underline"
          (click)="$event.stopPropagation()"
        >
          View details &rarr;
        </a>
      </article>
    }
  </div>
}
