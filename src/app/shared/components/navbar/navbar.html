<nav
  aria-label="Navigation principale"
  class="fixed inset-y-0 left-0 z-50 flex w-20 flex-col items-center gap-y-6 bg-surface-container-low py-8 ghost-border border-l-0 border-y-0"
>
  <a
    routerLink="/dashboard"
    class="group flex flex-col items-center gap-1 rounded-lg text-primary focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"
    [attr.aria-label]="appTitle + ' — accueil'"
  >
    <span class="material-symbols-outlined filled text-3xl" aria-hidden="true">flare</span>
    <span class="sr-only">{{ appTitle }}</span>
  </a>

  <ul role="list" class="flex flex-1 flex-col items-center gap-y-2">
    @for (item of primaryNav; track item.path) {
      <li>
        <a
          [routerLink]="item.path"
          routerLinkActive="!text-primary !bg-primary/10 border-primary"
          [routerLinkActiveOptions]="{ exact: false }"
          [attr.aria-label]="item.label"
          class="group relative flex size-12 items-center justify-center border-r-2 border-transparent text-on-surface-variant transition-colors duration-200 hover:bg-surface-container hover:text-primary focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-primary"
        >
          <span class="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
          <span class="sr-only">{{ item.label }}</span>
          <span
            class="pointer-events-none absolute left-full ml-3 hidden whitespace-nowrap rounded-lg bg-surface-container-high px-3 py-1.5 text-xs font-medium text-on-surface shadow-lg ghost-border group-hover:block group-focus-visible:block"
            role="tooltip"
          >
            {{ item.label }}
          </span>
        </a>
      </li>
    }
  </ul>

  <a
    routerLink="/login"
    class="group relative flex size-12 items-center justify-center text-on-surface-variant transition-colors duration-200 hover:text-primary focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-primary"
    aria-label="Connexion"
  >
    <span class="material-symbols-outlined" aria-hidden="true">login</span>
    <span class="sr-only">Connexion</span>
  </a>
</nav>
