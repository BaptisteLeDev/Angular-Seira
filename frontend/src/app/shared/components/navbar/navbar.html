<nav
  aria-label="Navigation principale"
  class="fixed inset-y-0 left-0 z-50 flex w-20 flex-col items-center gap-y-6 bg-surface-container-low py-8 ghost-border border-l-0 border-y-0"
>
  <a
    routerLink="/dashboard"
    class="group flex flex-col items-center gap-1 squircle-lg text-primary focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"
    [attr.aria-label]="appTitle + ' — accueil'"
  >
    <span class="icon-[heroicons--academic-cap-solid] text-3xl" aria-hidden="true"></span>
    <span class="sr-only">{{ appTitle }}</span>
  </a>

  <ul role="list" class="flex flex-1 flex-col items-center gap-y-2">
    @for (item of navItems(); track item.path) {
      <li>
        <a
          [routerLink]="item.path"
          routerLinkActive="!text-primary !bg-primary/10 border-primary"
          [routerLinkActiveOptions]="{ exact: false }"
          [attr.aria-label]="item.label"
          class="group relative flex size-12 items-center justify-center border-r-2 border-transparent text-on-surface-variant transition-colors duration-200 hover:bg-surface-container hover:text-primary focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-primary squircle-lg"
        >
          <span class="text-2xl" [class]="item.icon" aria-hidden="true"></span>
          <span class="sr-only">{{ item.label }}</span>
          <span
            class="pointer-events-none absolute left-full ml-3 hidden whitespace-nowrap squircle-lg bg-surface-container-high px-3 py-1.5 text-xs font-medium text-on-surface shadow-lg ghost-border group-hover:block group-focus-visible:block"
            role="tooltip"
          >
            {{ item.label }}
          </span>
        </a>
      </li>
    }
  </ul>

  @if (isAuthenticated()) {
    <button
      type="button"
      (click)="logout()"
      class="group relative flex size-12 items-center justify-center text-on-surface-variant transition-colors duration-200 hover:text-error focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-primary"
      aria-label="Deconnexion"
    >
      <span
        class="icon-[heroicons--arrow-right-start-on-rectangle] text-2xl"
        aria-hidden="true"
      ></span>
      <span class="sr-only">Deconnexion</span>
      <span
        class="pointer-events-none absolute left-full ml-3 hidden whitespace-nowrap squircle-lg bg-surface-container-high px-3 py-1.5 text-xs font-medium text-on-surface shadow-lg ghost-border group-hover:block group-focus-visible:block"
        role="tooltip"
      >
        Deconnexion
      </span>
    </button>
  } @else {
    <a
      routerLink="/login"
      class="group relative flex size-12 items-center justify-center text-on-surface-variant transition-colors duration-200 hover:text-primary focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-primary"
      aria-label="Connexion"
    >
      <span
        class="icon-[heroicons--arrow-right-end-on-rectangle] text-2xl"
        aria-hidden="true"
      ></span>
      <span class="sr-only">Connexion</span>
    </a>
  }
</nav>
